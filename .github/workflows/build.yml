name: Build and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  desktop:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        diagnostics: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev libsdl2-ttf-dev libavcodec-dev libavutil-dev libswscale-dev libopus-dev libprotobuf-c-dev libprotobuf-dev protobuf-compiler libmbedtls-dev libcurl4-openssl-dev libjpeg-dev libssl-dev fonts-noto-cjk
      - name: Build and test
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DNSL_DIAGNOSTICS=${{ matrix.diagnostics }} -DNSL_BUILD_TOOLS=OFF
          cmake --build build/desktop -j2
          ctest --test-dir build/desktop --output-on-failure
          python3 scripts/test-release.py
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Allow container checkout owner
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake python3 python3-cryptography build-essential git
          scripts/setup-switch-deps.sh
      - name: Build NRO (diagnostics excluded)
        run: scripts/build-switch.sh -DNSL_DIAGNOSTICS=OFF -DNSL_BUILD_TOOLS=OFF -DNSL_TEST_FORCE_1080=OFF -DHACBREWPACK="$GITHUB_WORKSPACE/build/deps/hacBrewPack/hacbrewpack"
      - name: Verify release graphics and diagnostic exclusion
        run: python3 scripts/check-release-diagnostics.py build/switch
      - name: Validate and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(--identity build/switch/generated/build_identity.json --nro build/switch/app/nsteamlink.nro --icon assets/branding/icon.jpg --require-clean)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/validate-artifacts.py "${args[@]}"
          python3 scripts/collect-release.py --build build/switch --output build/release
          cp build/deps/devkitpro-packages.txt build/release/
          (cd build/release && sha256sum *.nro *.json *.txt > SHA256SUMS)
          python3 scripts/check-release-bundle.py build/release
      - uses: actions/upload-artifact@v4
        with:
          name: switch-release
          path: build/release/
          if-no-files-found: error
      - name: Build Switch diagnostics and video correctness probe
        run: |
          NSL_BUILD_DIR="$GITHUB_WORKSPACE/build/switch-deko" scripts/build-switch.sh -DNSL_DIAGNOSTICS=ON -DNSL_BUILD_TOOLS=OFF -DHACBREWPACK="$GITHUB_WORKSPACE/build/deps/hacBrewPack/hacbrewpack"
      - name: Verify release exclusion counterexamples
        run: python3 scripts/test-release-exclusion.py --build build/switch --diagnostic-build build/switch-deko
      - name: Verify actual live FEC observer paths and ordinary exclusion
        run: python3 -O scripts/test-live-media-probe-build.py --build build/switch-deko --ordinary-build build/switch --output build/switch-deko/generated/live-probe-build.json
      - name: Verify isolated large VCL capability probe
        run: |
          python3 scripts/check-vcl-probe-build.py --build build/switch-deko --ordinary build/switch/app/nsteamlink.nro --output build/switch-deko/generated/vcl-probe-build.json
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: switch-deko-diagnostic
          path: |
            build/switch-deko/app/*.nro
            build/switch-deko/generated/*.json
            build/switch-deko/app/*.dksh
            app/tests/fixtures/video/*
            build/deps/devkitpro-packages.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, switch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: switch-release
          path: release
      - name: Publish application artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release/*.nro' >/dev/null
          (cd release && sha256sum -c SHA256SUMS)
          python3 scripts/check-release-bundle.py release
          test "$(head -n 1 .github/RELEASE_NOTES.md)" = "# NSteamLink $RELEASE_TAG"
          # Create a draft first so an upload failure never leaves a half release visible.
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --notes-file .github/RELEASE_NOTES.md --title "NSteamLink $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
