<div id="nsl-final" aria-label="nsteamlink 精简交互方案">
<style>
#nsl-final{container-type:inline-size;--s-bg:light-dark(#edf3f8,#102235);--s-panel:light-dark(#ffffff,#1c344b);--s-hover:light-dark(#dce9f4,#28475f);--s-text:light-dark(#182f45,#edf5fc);--s-sub:light-dark(#526a7e,#b0c5d5);--s-line:light-dark(#c8d7e2,#39566e);--s-accent:light-dark(#0869ab,#8ed5ff);--s-on:light-dark(#ffffff,#102b3e);--s-error:light-dark(#a33441,#ffb3be);font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--s-text)}
#nsl-final *{box-sizing:border-box}#nsl-final [hidden]{display:none!important}#nsl-final h1,#nsl-final h2,#nsl-final p{margin:0;font-weight:400}#nsl-final button{font:inherit;color:inherit;border:1px solid transparent;border-radius:6px;background:var(--s-panel);padding:10px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-align:left}#nsl-final button:hover{background:var(--s-hover)}#nsl-final button.cursor{box-shadow:0 0 0 3px var(--s-accent),0 0 0 5px var(--s-bg)}#nsl-final button.primary{background:var(--s-accent);color:var(--s-on)}#nsl-final button.plain{background:transparent}#nsl-final button.danger{color:var(--s-error)}#nsl-final .shell{font-size:clamp(18px,2.45cqw,31px);line-height:1.45;min-height:clamp(414px,56.25cqw,720px);background:var(--s-bg);border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}#nsl-final .top{padding:clamp(12px,1.8cqw,24px) clamp(20px,3.3cqw,42px) 0;display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:clamp(15px,2cqw,25px)}#nsl-final .brand{font-weight:500;letter-spacing:.5px}#nsl-final .sub{color:var(--s-sub)}#nsl-final .key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border:1px solid currentColor;border-radius:50%;font-size:clamp(13px,1.7cqw,22px);line-height:1;flex-shrink:0}#nsl-final .key.shoulder{border-radius:5px;min-width:27px}#nsl-final .middle{display:grid;min-width:0}#nsl-final .scene,#nsl-final .modal{grid-area:1/1;min-width:0}#nsl-final .tabs{display:flex;align-items:center;gap:10px;padding:clamp(9px,1.4cqw,18px) clamp(20px,3.3cqw,42px);border-bottom:1px solid var(--s-line)}#nsl-final .tabnames{display:flex;flex:1;justify-content:center;gap:clamp(10px,2.3cqw,30px);min-width:0}#nsl-final .tabs button{background:transparent;padding:8px 10px;white-space:nowrap}#nsl-final .tabs button.current{border-radius:0;border-bottom:3px solid var(--s-accent);color:var(--s-accent)}#nsl-final .tabs .step{padding:5px;flex-shrink:0}#nsl-final .content{padding:clamp(20px,3.1cqw,40px) clamp(24px,4cqw,51px);display:flex;flex-direction:column;justify-content:center;min-height:clamp(256px,34.6cqw,443px)}#nsl-final h1{font-size:clamp(26px,3.5cqw,45px)}#nsl-final h2{font-size:clamp(21px,2.85cqw,36px)}#nsl-final p{font-size:inherit;color:var(--s-sub);margin-top:12px}#nsl-final .center{text-align:center;align-items:center;gap:5px}#nsl-final .actions{display:flex;justify-content:center;gap:16px;margin-top:22px;flex-wrap:wrap}#nsl-final .sectionhead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}#nsl-final .sectionhead button{background:transparent;color:var(--s-accent);padding:6px 8px}#nsl-final .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(15px,2.6cqw,33px)}#nsl-final .game{position:relative;isolation:isolate;min-height:clamp(138px,19.5cqw,250px);overflow:hidden;border:0;padding:20px;align-items:end;justify-content:start}#nsl-final .poster{--p-a:light-dark(#d3e3c1,#365541);--p-b:light-dark(#afc6a7,#1e3f37);--p-ink:light-dark(#26402d,#f2f7df);--p-shape:light-dark(#e9edc8,#a8ba83);background:linear-gradient(145deg,var(--p-a),var(--p-b));color:var(--p-ink)}#nsl-final .poster:before{content:"";position:absolute;width:45%;aspect-ratio:1;border:clamp(10px,2cqw,26px) solid var(--p-shape);border-radius:50%;right:-7%;top:-25%;opacity:.5;z-index:-1}#nsl-final .poster:after{content:"";position:absolute;inset:70% -10% -80%;background:var(--p-a);transform:rotate(-15deg);z-index:-1;opacity:.4}#nsl-final .hades{--p-a:light-dark(#e6c4be,#693c48);--p-b:light-dark(#c99f92,#402f3c);--p-ink:light-dark(#552c30,#ffe7d8);--p-shape:light-dark(#efdbac,#bfa374)}#nsl-final .hollow{--p-a:light-dark(#cbdbea,#344e72);--p-b:light-dark(#a7bdd3,#20354d);--p-ink:light-dark(#243a56,#e6f0ff);--p-shape:light-dark(#ebf2fd,#9db1cb)}#nsl-final .two{--p-a:light-dark(#edd5ac,#795831);--p-b:light-dark(#d1b386,#50422e);--p-ink:light-dark(#503a20,#ffedc9);--p-shape:light-dark(#f8eac5,#c9b17b)}#nsl-final button.poster:hover{background:linear-gradient(145deg,var(--p-a),var(--p-b))}#nsl-final .game span{font-size:clamp(23px,3.15cqw,40px);font-weight:500}#nsl-final .footer{padding:8px clamp(18px,3cqw,38px);min-height:52px;border-top:1px solid var(--s-line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:clamp(15px,2cqw,25px)}#nsl-final .hints{display:flex;gap:clamp(6px,1.2cqw,15px);align-items:center;flex-wrap:wrap}#nsl-final .footer button{background:transparent;padding:5px;gap:7px;min-height:36px}#nsl-final .modal{background:var(--s-bg);z-index:2;padding:clamp(20px,3.4cqw,44px);display:grid;place-items:center}#nsl-final .dialog{width:min(100%,480px)}#nsl-final .dialog.wide{width:100%}#nsl-final .dialog h2{margin-bottom:18px}#nsl-final .list{display:grid;gap:10px}#nsl-final .list button{width:100%;justify-content:space-between;min-height:46px}#nsl-final .code{font-size:clamp(48px,8cqw,102px);letter-spacing:.18em;font-variant-numeric:tabular-nums;margin:12px 0 16px;color:var(--s-accent)}#nsl-final .inputlayout{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}#nsl-final .display{display:block;font-size:clamp(24px,3.6cqw,46px);font-variant-numeric:tabular-nums;letter-spacing:1px;min-height:50px;overflow-wrap:anywhere;color:var(--s-accent)}#nsl-final .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#nsl-final .numpad button{padding:7px;min-height:40px}#nsl-final .numpad .submit{grid-column:1/-1}#nsl-final .error{color:var(--s-error);margin-top:12px}#nsl-final .stream{position:relative;isolation:isolate;display:grid;place-items:center;min-height:clamp(312px,44cqw,563px);overflow:hidden}#nsl-final .stream h1{font-size:clamp(34px,5.5cqw,70px)}#nsl-final .hold{position:relative;touch-action:none;user-select:none;overflow:hidden}#nsl-final .hold:after{content:"";position:absolute;bottom:0;left:0;height:3px;width:0;background:var(--s-accent);transition:width .8s linear}#nsl-final .hold.holding:after{width:100%}#nsl-final .shortcut{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--s-sub)}#nsl-final .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:1000px){#nsl-final .dialog{width:70%}#nsl-final .list{gap:16px}#nsl-final button{padding:14px 24px;min-height:60px}#nsl-final .key{height:31px;min-width:31px}#nsl-final .numpad{gap:12px}#nsl-final .numpad button{min-height:60px}}
@media(max-width:520px){#nsl-final .tabnames{gap:4px}#nsl-final .tabs{gap:4px;padding:10px}#nsl-final .tabs button{padding:8px 5px}#nsl-final .content{padding:22px}#nsl-final .sectionhead{flex-wrap:wrap;gap:8px}#nsl-final .games{gap:14px}#nsl-final .game{padding:15px;min-height:140px}#nsl-final .game span{font-size:22px}#nsl-final .inputlayout{grid-template-columns:1fr;gap:18px}#nsl-final .dialog h2{margin-bottom:12px}#nsl-final .modal{padding:24px}#nsl-final .footer{padding:8px 14px}#nsl-final .top{padding:14px 20px 0}}
</style>
<style>
#nsl-final .reviewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 14px;font-size:16px;line-height:1.4}
#nsl-final .reviewbar label{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}
#nsl-final .reviewbar select{flex:1;min-width:0;width:100%;font:inherit;color:var(--s-text);background:var(--s-panel);border:1px solid var(--s-line);border-radius:6px;min-height:44px;padding:8px}
#nsl-final .reviewbar button{font-size:16px;min-height:44px;padding:8px 12px}

#nsl-final .reviewresponse span{color:var(--s-sub)}

#nsl-final .footer button,#nsl-final .tabs .step,#nsl-final .numpad button{min-height:44px;min-width:44px}

#nsl-final .tabnames small{font-size:clamp(15px,2cqw,25px);color:var(--s-sub);font-weight:400}
#nsl-final .host-details{margin:0;display:grid;gap:12px}
#nsl-final .host-details>div{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

#nsl-final .is-stream{grid-template-rows:1fr}
#nsl-final .is-stream .middle,#nsl-final .is-stream .stream,#nsl-final .is-stream .remote-screen{min-height:clamp(414px,56.25cqw,720px)}
#nsl-final .is-stream .scene{display:grid}
#nsl-final .remote-screen{position:relative}
#nsl-final .floating-menu{position:absolute;top:16px;right:16px;min-width:60px;min-height:44px;padding:7px 12px;z-index:1;background:var(--s-panel);font-size:clamp(16px,2.2cqw,28px)}
#nsl-final .is-stream .modal{padding:0;place-items:stretch;background:light-dark(#152a4133,#06132055)}
#nsl-final .is-stream .dialog{justify-self:end;width:52%;max-width:580px;padding:clamp(22px,3cqw,38px);background:var(--s-panel);display:flex;flex-direction:column;justify-content:center}
#nsl-final .is-stream .dialog .list button{background:var(--s-hover)}
#nsl-final .is-stream .dialog .list button.primary{background:var(--s-accent)}
#nsl-final .is-stream .dialog h2{overflow-wrap:anywhere}
#nsl-final .debug-hud{position:absolute;top:18px;left:18px;width:44%;max-width:420px;background:var(--s-panel);color:var(--s-text);padding:16px 18px;border-radius:7px;font-size:clamp(14px,1.85cqw,24px);pointer-events:none;text-align:left;z-index:2;line-height:1.5}
#nsl-final .debug-hud h2{font-size:inherit;margin-bottom:10px;color:var(--s-sub)}
#nsl-final .debug-hud dl{margin:0;display:grid;gap:7px}
#nsl-final .debug-hud dl>div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#nsl-final .debug-hud dd{margin:0;font-variant-numeric:tabular-nums}
@media(max-width:520px){#nsl-final .debug-hud{left:12px;top:12px;width:calc(100% - 108px);padding:12px}#nsl-final .debug-hud dl>div{gap:4px}}
@media(max-width:520px){#nsl-final .is-stream .dialog{width:100%}#nsl-final .floating-menu{top:12px;right:12px}}
@media(max-width:520px){#nsl-final .reviewbar{gap:8px}#nsl-final .reviewbar label{min-width:100%}#nsl-final .reviewresponse span{width:100%}}
</style>
<div class="reviewbar" aria-label="Mock 场景预览工具">
  <label>预览场景
    <select data-preview aria-label="预览场景">
      <optgroup label="首页">
        <option value="daily">日常首页 · 多台电脑</option><option value="single">日常首页 · 单台电脑</option><option value="first">首次打开 · 自动查找</option><option value="empty">没有找到电脑</option><option value="found">发现电脑 · 尚无配对记录</option><option value="duplicate">发现同名电脑</option><option value="unnamed">广播未提供名称</option><option value="offline">已保存电脑 · 暂未发现</option><option value="nohistory">已配对 · 无游玩记录</option><option value="unauthorized">需要重新配对</option>
      </optgroup>
      <optgroup label="连接流程">
        <option value="manual">手动添加电脑</option><option value="pairing">电脑输入配对码</option><option value="saving">保存配对</option><option value="pin">输入连接安全码</option><option value="connecting">正在连接</option>
      </optgroup>
      <optgroup label="异常状态">
        <option value="network-error">网络不可用</option><option value="pair-denied">配对被拒绝</option><option value="pair-timeout">配对超时</option><option value="save-failed">配对保存失败</option><option value="connect-timeout">连接超时</option><option value="locked">电脑已锁定</option><option value="launch-failed">游戏启动失败</option>
      </optgroup>
      <optgroup label="串流与设置">
        <option value="debug">高级 Debug · 只读浮层</option><option value="debug-menu">Debug 快捷键 · 在游玩菜单触发</option>
        <option value="stream">游戏串流 · 全屏</option><option value="remote">Steam 串流 · 全屏</option><option value="stream-menu">游玩菜单</option><option value="disconnect">断开连接确认</option><option value="host-info">电脑信息</option><option value="options">首页选项</option><option value="settings">设置</option><option value="advanced">高级设置</option><option value="quality">画面偏好</option><option value="hotkey">菜单快捷键</option><option value="help">连接帮助</option><option value="forget">移除电脑确认</option><option value="exit">退出确认</option><option value="closed">应用已关闭</option>

  <button type="button" data-preview-reset>重置场景</button>

<div class="shell"><header class="top"><span class="brand">nsteamlink</span><span class="sub" data-status></span></header><div class="middle"><div class="scene"></div><div class="modal" hidden></div></div><footer class="footer"></footer><div class="sr" aria-live="polite" data-live></div></div>
<script>
(()=>{
const root=document.getElementById('nsl-final'),shell=root.querySelector('.shell'),scene=root.querySelector('.scene'),modal=root.querySelector('.modal'),footer=root.querySelector('.footer');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const games={farm:'星露谷物语',hades:'哈迪斯',hollow:'空洞骑士',two:'双人成行'};
// Example discovery payloads. No room labels, Steam account names, or game names.
const fixtures={
living:{hostname:'DESKTOP-7K2P9',address:'192.168.1.24',os:'Windows',gamesRunning:false},
study:{hostname:'LAPTOP-M4Q8',address:'192.168.1.38',os:'Windows',gamesRunning:true},
guest:{hostname:'linux-pc',address:'192.168.1.56',os:'Linux',gamesRunning:false},
bedroom:{hostname:'DESKTOP-B8N3',address:'192.168.1.71',os:'Windows',gamesRunning:false},
twin:{hostname:'DESKTOP-7K2P9',address:'192.168.1.62',os:'Windows',gamesRunning:false},
unnamed:{hostname:'',address:'192.168.1.83',os:null,gamesRunning:false},
manual:{hostname:'DESKTOP-P6R2',address:'192.168.1.90',os:'Windows',gamesRunning:false}
};
const hostInfo=id=>s.broadcast[id]||s.records[id]?.lastKnown||{};
const hostName=id=>hostInfo(id).hostname?.trim()||'未命名电脑';
const ambiguous=id=>!hostInfo(id).hostname?.trim()||ids().filter(other=>hostName(other)===hostName(id)).length>1;
function hostMeta(id){const info=hostInfo(id);return [info.os,ambiguous(id)?info.address:null].filter(Boolean).map(esc).join(' · ')}
const design={start:'daily',network:'normal',pair:'success',connection:'success',history:'extension',controller:'switch'};
let s,registry,rows,op=0,holdTimer=0,debugHoldTimer=0,discoveryTimer=0,discoveryGeneration=0,restore=[];const keys=new Set();
const key=k=>'<span class="key '+(['L','R','LB','RB'].includes(k)?'shoulder':'')+'">'+k+'</span>';
const shoulder=d=>design.controller==='switch'?(d<0?'L':'R'):(d<0?'LB':'RB');
const ids=()=>[...new Set([...Object.keys(s.records),...s.discoveredOrder])],online=id=>s.seen.includes(id),rec=id=>s.records[id];
const history=id=>{const r=rec(id);return design.history==='extension'&&r?.auth==='paired'?(r.histories[r.account]||[]):[]};
function later(fn,ms){const token=op;setTimeout(()=>{if(token===op&&root.isConnected)fn()},ms)}
function btn(id,label,fn,cls=''){registry.set(id,fn);return '<button type="button" data-focus="'+esc(id)+'" class="'+cls+'">'+label+'</button>'}
const cmd=(c,label,cls='')=>'<button type="button" class="'+cls+'" data-command="'+c+'">'+(c==='MENU'?key('−')+key('+'):key(c))+label+'</button>';
const hint=(c,label)=>'<span class="hint">'+key(c)+label+'</span>';
function focus(id,dom=true){const eligible=rows.flat();s.focus=eligible.includes(id)?id:eligible[0]||'';root.dataset.currentFocus=s.focus;shell.querySelectorAll('button[data-focus]').forEach(e=>{e.classList.toggle('cursor',e.dataset.focus===s.focus);if(dom&&e.dataset.focus===s.focus)e.focus({preventScroll:true})});if(!s.modal&&!s.session&&s.selected)s.hostFocus[s.selected]=s.focus;if(dom&&!s.focus)(s.session?shell.querySelector('button[data-command="MENU"]'):footer.querySelector('button'))?.focus({preventScroll:true})}
function render(dom=false){
if(s.modal!=='stream-menu')stopDebugHold();
registry=new Map();rows=[];const streaming=!!s.session;
root.dataset.selected=s.selected||'';root.dataset.view=s.closed?'closed':s.modal||(streaming?'stream':'home');root.dataset.target=s.session?.host||s.target||'';
shell.classList.toggle('is-stream',streaming);shell.querySelector('.top').hidden=streaming;footer.hidden=streaming;
scene.innerHTML=s.closed?closedView():streaming?streamView():homeView();scene.inert=!!s.modal;scene.style.visibility=s.modal&&!streaming?'hidden':'';modal.hidden=!s.modal;
if(s.modal){registry=new Map();rows=[];modal.innerHTML=modalView();if(streaming&&s.modal!=='stream-menu')modal.querySelector('.dialog')?.insertAdjacentHTML('beforeend','<div class="actions">'+cmd('B','返回')+'</div>')}else modal.innerHTML='';
footer.innerHTML=footerView();root.querySelector('[data-status]').textContent=s.target?hostName(s.target):s.scanError&&ids().length?'网络不可用':'';
focus(s.focus,dom);syncPreview();
}
function tabView(){const all=ids();if(!all.length)return '';const index=Math.max(0,all.indexOf(s.selected));const count=root.clientWidth<520?1:2;const start=Math.min(Math.max(0,index-Math.floor(count/2)),Math.max(0,all.length-count));return '<nav class="tabs" aria-label="选择电脑">'+(all.length>1?'<button type="button" class="step" data-command="L" aria-label="上一台电脑">'+key(shoulder(-1))+'</button>':'')+'<div class="tabnames">'+all.slice(start,start+count).map(id=>'<button type="button" data-tab="'+id+'" aria-pressed="'+(id===s.selected)+'" class="'+(id===s.selected?'current':'')+'"><span>'+esc(hostName(id))+'</span>'+(ambiguous(id)?'<small>'+esc(hostInfo(id).address||'地址未知')+'</small>':'')+'</button>').join('')+'</div>'+(all.length>1?'<button type="button" class="step" data-command="R" aria-label="下一台电脑">'+key(shoulder(1))+'</button>':'')+'</nav>'}
function homeView(){
let body='';const id=s.selected;
if(!ids().length){rows=[];body='<div class="content center"><h1>'+(s.scanError?'网络未连接':s.initialSearch?'正在查找电脑':'尚未发现电脑')+'</h1><p>'+(s.scanError?'联网后会自动继续查找':'在同一网络中打开 Steam')+'</p></div>'}
else if(!online(id)){rows=[];body='<div class="content center"><h1>暂未发现这台电脑</h1><p>正在自动查找</p></div>'}
else if(rec(id)?.auth!=='paired'){rows=[['pair']];body='<div class="content center"><h1>'+(rec(id)?.auth==='needs'?'需要重新配对':'连接这台电脑')+'</h1>'+(hostMeta(id)?'<p>'+hostMeta(id)+'</p>':'')+(hostInfo(id).gamesRunning?'<p>电脑正在运行游戏</p>':'')+'<div class="actions">'+btn('pair','配对并连接',()=>request(id,null),'primary')+'</div></div>'}
else{const hist=history(id).slice(0,2);if(hist.length){rows=[['steam'],hist.map(g=>'game:'+g)];body='<div class="content"><div class="sectionhead"><h2>最近游玩</h2>'+btn('steam','打开 Steam →',()=>request(id,null))+'</div><div class="games">'+hist.map(g=>btn('game:'+g,'<span>'+games[g]+'</span>',()=>request(id,g),'game poster '+g)).join('')+'</div></div>';if(!s.focus)s.focus='game:'+hist[0]}else{rows=[['steam']];body='<div class="content center"><h1>准备就绪</h1>'+(hostMeta(id)?'<p>'+hostMeta(id)+'</p>':'')+'<div class="actions">'+btn('steam','开始游玩',()=>request(id,null),'primary')+'</div></div>'}}
return tabView()+body;
}
